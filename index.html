<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্বাস্থ্যবাজার — অনলাইন ফার্মেসি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0e7673;--brand-dark:#0a5a58;--brand-light:#e7f4f3;--accent:#f0663a;--bg:#f2f5f5;--card:#fff;--text:#1f2a2a;--muted:#6b7a7a;--line:#e1e8e8;--radius:12px;--ok:#16a34a;--warn:#f59e0b;--err:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
img{max-width:100%;display:block}
.container{max-width:1240px;margin:0 auto;padding:0 16px;width:100%}
main{flex:1;padding:18px 0 30px}

/* announcement */
.announce{background:var(--brand-dark);color:#fff;font-size:14px;text-align:center;padding:7px 40px;position:relative}
.announce button{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:18px;cursor:pointer}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.head-row{display:flex;align-items:center;gap:18px;padding:12px 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--brand);white-space:nowrap}
.logo .mark{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px;overflow:hidden}
.logo .mark img{width:100%;height:100%;object-fit:cover}
.search{flex:1;display:flex;border:2px solid var(--brand);border-radius:999px;overflow:hidden;background:#fff;position:relative}
.search input{flex:1;border:0;padding:9px 18px;outline:none;min-width:0}
.search button{background:var(--brand);color:#fff;border:0;padding:0 22px;cursor:pointer}
.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;box-shadow:0 10px 30px rgba(0,0,0,.1);display:none;z-index:60;max-height:360px;overflow:auto}
.suggest a{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.suggest a:hover{background:var(--brand-light)}
.suggest .si{width:36px;height:36px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:20px;overflow:hidden;flex-shrink:0}
.flash{background:var(--accent);color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.head-links{display:flex;gap:16px;font-size:13px;align-items:center}
.head-links a{display:flex;flex-direction:column;align-items:center;color:var(--muted);position:relative}
.head-links a b{font-size:20px;line-height:1.2}
.head-links a:hover{color:var(--brand)}
.badge-count{position:absolute;top:-4px;right:-8px;background:var(--accent);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
nav.tabs{display:flex;gap:4px;padding-bottom:10px;align-items:center;flex-wrap:wrap}
nav.tabs a{padding:5px 16px;border-radius:999px;font-size:15px;color:var(--muted)}
nav.tabs a.active,nav.tabs a:hover{background:var(--brand-light);color:var(--brand);font-weight:600}
.dropdown{position:relative;margin-left:auto}
.dropdown>button{background:#fff;border:1px solid var(--brand);color:var(--brand);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.dropdown ul{display:none;position:absolute;right:0;top:115%;background:#fff;border:1px solid var(--line);border-radius:10px;list-style:none;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:70;overflow:hidden}
.dropdown.open ul{display:block}
.dropdown li a{display:block;padding:10px 14px}
.dropdown li a:hover{background:var(--brand-light)}

/* common */
.block{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:20px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sec-head h2,.sec-head h3{font-size:20px}
.sec-head a{color:var(--brand);font-weight:600;font-size:14px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--brand-dark)}
.btn.outline{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.outline:hover{background:var(--brand-light)}
.btn.accent{background:var(--accent)}
.btn.block-btn{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--brand)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty div{font-size:56px;margin-bottom:10px}
label.f{display:block;margin-bottom:12px;font-size:14px;font-weight:500}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;background:#fff}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.rx{background:#fee2e2;color:var(--err);font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600}

/* hero */
.hero{position:relative;border-radius:var(--radius);overflow:hidden;height:300px;margin-bottom:16px}
.slide{position:absolute;inset:0;display:flex;align-items:center;padding:0 56px;color:#fff;opacity:0;transition:opacity .6s;background-size:cover;background-position:center}
.slide.show{opacity:1;z-index:1}
.slide h2{font-size:38px;line-height:1.2;max-width:600px}
.slide p{font-size:18px;margin:8px 0 18px;opacity:.92;max-width:560px}
.slide .btn{background:#fff;color:var(--text)}
.dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.dots button{width:10px;height:10px;border-radius:6px;border:0;background:rgba(255,255,255,.5);cursor:pointer;transition:.3s}
.dots button.on{background:#fff;width:26px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.chips a{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:14px}
.chips a:hover{border-color:var(--brand);color:var(--brand)}

/* product */
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.row::-webkit-scrollbar{height:6px}.row::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.row .p-card{min-width:190px;max-width:190px;scroll-snap-align:start}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.p-card{border:1px solid var(--line);border-radius:10px;padding:12px;position:relative;display:flex;flex-direction:column;background:#fff;transition:.2s}
.p-card:hover{box-shadow:0 6px 20px rgba(14,118,115,.12);border-color:var(--brand-light)}
.p-img{height:130px;border-radius:8px;display:grid;place-items:center;font-size:52px;margin-bottom:10px;background:var(--bg);overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.off{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;z-index:1}
.p-name{font-size:14px;font-weight:500;height:42px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.p-name:hover{color:var(--brand)}
.p-unit{font-size:12px;color:var(--muted)}
.price{margin:6px 0}
.price b{font-size:17px;color:var(--brand-dark)}
.price s{color:var(--muted);font-size:13px;margin-left:6px}
.express{font-size:11px;background:#e7f7ef;color:var(--ok);padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;align-self:flex-start}
.stars{color:#f5a623;font-size:12px}
.add{margin-top:10px;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px;font-weight:600;cursor:pointer}
.add:hover{background:var(--brand-dark)}
.add:disabled{background:#cbd5d5;cursor:not-allowed}
.qtybox{margin-top:10px;display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--brand);border-radius:8px;overflow:hidden}
.qtybox button{background:var(--brand-light);color:var(--brand);border:0;width:36px;height:34px;font-size:18px;cursor:pointer;font-weight:700}
.qtybox span{font-weight:700;color:var(--brand)}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.cat{border:1px solid var(--line);border-radius:10px;padding:16px 8px;text-align:center;font-size:14px;transition:.2s;background:#fff}
.cat:hover{border-color:var(--brand);transform:translateY(-2px);color:var(--brand)}
.cat div{font-size:32px;margin-bottom:6px}

.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.why div{background:var(--brand-light);border-radius:10px;padding:16px}
.why h4{margin-bottom:4px;color:var(--brand-dark)}
.why p{font-size:14px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;counter-reset:s}
.steps div{border:1px dashed var(--brand);border-radius:10px;padding:16px 16px 16px 56px;position:relative}
.steps div::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.app-cta{background:linear-gradient(120deg,var(--brand),var(--brand-dark));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.store-btn{background:#000;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;display:inline-block;margin:4px}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin-top:6px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center}
.stats b{font-size:28px;color:var(--brand);display:block}
.stats span{color:var(--muted);font-size:14px}

/* shop */
.shop{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:130px}
.side h4{font-size:15px;margin:4px 0 8px}
.side a.c{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:14px}
.side a.c:hover,.side a.c.on{background:var(--brand-light);color:var(--brand);font-weight:600}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px}

/* product detail */
.pd{display:grid;grid-template-columns:420px 1fr;gap:30px}
.pd-img{background:var(--bg);border-radius:12px;height:400px;display:grid;place-items:center;font-size:140px;overflow:hidden}
.pd-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.pd h1{font-size:26px;line-height:1.3}
.pd .price b{font-size:28px}
.pd .price s{font-size:17px}
.qty-lg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-right:10px}
.qty-lg button{width:40px;height:44px;border:0;background:var(--bg);font-size:20px;cursor:pointer}
.qty-lg input{width:56px;border:0;text-align:center;font-weight:700}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.feat div{background:var(--brand-light);border-radius:8px;padding:10px;font-size:13px;text-align:center;color:var(--brand-dark)}

/* cart */
.cart-wrap{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.ci{display:grid;grid-template-columns:70px 1fr auto auto 30px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .p-img{height:70px;width:70px;font-size:34px;margin:0}
.ci .qtybox{margin:0;width:110px}
.ci .x{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum .tot{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-size:19px;font-weight:700;color:var(--brand-dark)}
.coupon{display:flex;gap:8px;margin:12px 0}
.coupon input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-transform:uppercase}
.paybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.paybox label{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.paybox label:has(input:checked){border-color:var(--brand);background:var(--brand-light)}

/* orders */
.order-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.order-card .oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.timeline{display:flex;margin:16px 0 6px}
.timeline div{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative}
.timeline div::before{content:'';display:block;width:18px;height:18px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.timeline div::after{content:'';position:absolute;top:8px;left:-50%;width:100%;height:3px;background:var(--line)}
.timeline div:first-child::after{display:none}
.timeline div.done{color:var(--brand);font-weight:600}
.timeline div.done::before,.timeline div.done::after{background:var(--brand)}

/* account */
.auth{max-width:440px;margin:0 auto}
.tabsw{display:flex;margin-bottom:16px;border-bottom:2px solid var(--line)}
.tabsw button{flex:1;background:none;border:0;padding:10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabsw button.on{color:var(--brand);border-color:var(--brand)}
.acc{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.acc nav a{display:block;padding:10px 12px;border-radius:8px}
.acc nav a.on,.acc nav a:hover{background:var(--brand-light);color:var(--brand);font-weight:600}

/* cards (lab/doctor/blog) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;display:flex;flex-direction:column}
.card h4{font-size:17px;margin-bottom:4px}
.card .btn{margin-top:auto}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand-light);display:grid;place-items:center;font-size:34px;margin-bottom:10px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.post-cover{height:160px;border-radius:10px;background:linear-gradient(120deg,var(--brand-light),#fff);display:grid;place-items:center;font-size:64px;margin-bottom:12px;overflow:hidden}
.post-cover img{width:100%;height:100%;object-fit:cover}
.article{max-width:780px;margin:0 auto}
.article p{margin-bottom:14px;font-size:17px}

.upload-zone{border:2px dashed var(--brand);border-radius:12px;padding:30px;text-align:center;background:var(--brand-light);cursor:pointer;margin-bottom:14px}
.upload-zone img{max-height:240px;margin:10px auto 0;border-radius:8px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal h3{margin-bottom:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:10px 22px;border-radius:999px;transition:.3s;z-index:300;font-size:15px}
.toast.show{transform:translateX(-50%) translateY(0)}
.float-wa{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:90}

/* footer */
footer{background:#0b2928;color:#bfd3d2;padding:40px 0 20px;font-size:14px}
.f-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:24px}
footer h5{color:#fff;font-size:16px;margin-bottom:10px}
footer li{list-style:none;margin-bottom:6px}
footer a:hover{color:#fff}
.pay{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
.pay span{background:#123d3b;padding:6px 12px;border-radius:6px;font-size:12px}
.social a{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#123d3b;margin-right:6px}
.copy{border-top:1px solid #1b4c4a;padding-top:16px;text-align:center;color:#86a5a3;font-size:13px}
.mob-cat-btn{display:none}

@media(max-width:900px){
  .head-row{flex-wrap:wrap}.search{order:3;flex-basis:100%}.flash{display:none}
  .f-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}
  .slide h2{font-size:26px}.slide{padding:0 24px}.hero{height:240px}
  .shop,.cart-wrap,.acc,.pd{grid-template-columns:1fr}
  .side{position:static;display:none}.side.open{display:block}.mob-cat-btn{display:inline-flex}
  .pd-img{height:280px}.grid2{grid-template-columns:1fr}
  .ci{grid-template-columns:60px 1fr 30px;grid-template-areas:"i n x" "i q t"}
  .ci .p-img{grid-area:i;width:60px;height:60px}.ci .nm{grid-area:n}.ci .qtybox{grid-area:q}.ci .lt{grid-area:t;text-align:right}.ci .x{grid-area:x}
  .head-links span.lbl{display:none}
}
</style>
</head>
<body>

<div id="announce"></div>
<header>
  <div class="container">
    <div class="head-row">
      <a href="#/" class="logo" id="logo"></a>
      <form class="search" id="searchForm" autocomplete="off">
        <input name="q" id="searchInput" placeholder="ওষুধ, হেলথ প্রোডাক্ট বা ব্র্যান্ড খুঁজুন…">
        <button>খুঁজুন</button>
        <div class="suggest" id="suggest"></div>
      </form>
      <a href="#/shop?sort=discount" class="flash" id="flashBtn"></a>
      <div class="head-links">
        <a href="#/account" id="accLink"><b>👤</b><span class="lbl" id="accLabel">লগইন</span></a>
        <a href="#/orders"><b>📦</b><span class="lbl">অর্ডার</span></a>
        <a href="#/cart"><b>🛒</b><span class="lbl">কার্ট</span><span class="badge-count" id="cartCount">০</span></a>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/" data-r="">সব</a>
      <a href="#/shop" data-r="shop">স্টোর</a>
      <a href="#/lab" data-r="lab">ল্যাব টেস্ট</a>
      <a href="#/doctor" data-r="doctor">ডাক্তার</a>
      <a href="#/blog" data-r="blog">ব্লগ</a>
      <div class="dropdown" id="dd">
        <button type="button">অর্ডার করুন ▾</button>
        <ul id="ddList"></ul>
      </div>
    </nav>
  </div>
</header>

<main class="container" id="app"></main>

<footer id="footer"></footer>
<a class="float-wa" id="floatWa" href="#" target="_blank" title="হোয়াটসঅ্যাপ">💬</a>
<div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script>
/* ========== helpers ========== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const S = () => DB.data.settings;
const app = $('#app');
let timers = [];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

const products = () => DB.all('products').filter(p=>p.active);
const catName = id => (DB.get('categories',id)||{}).name||'';
const off = p => p.mrp>p.price ? Math.round((1-p.price/p.mrp)*100) : 0;
const pimg = (x,emoji='📦') => x.img ? `<img src="${esc(x.img)}" alt="${esc(x.name||x.title||'')}" loading="lazy">` : esc(x.icon||emoji);

/* ========== cart & user ========== */
const Cart = {
  items(){try{return JSON.parse(localStorage.getItem('sb_cart'))||[]}catch(e){return[]}},
  save(c){localStorage.setItem('sb_cart',JSON.stringify(c));renderHeader()},
  qtyOf(id){const i=this.items().find(x=>x.id===id);return i?i.qty:0},
  set(id,q){
    const p=DB.get('products',id);if(!p)return;
    let c=this.items();q=Math.max(0,Math.min(q,p.stock));
    if(q>0 && q===this.qtyOf(id) && q===p.stock){toast('স্টকে আর নেই');}
    const i=c.find(x=>x.id===id);
    if(q===0)c=c.filter(x=>x.id!==id);else if(i)i.qty=q;else c.push({id,qty:q});
    this.save(c);
  },
  add(id,q=1){this.set(id,this.qtyOf(id)+q)},
  clear(){this.save([]);localStorage.removeItem('sb_coupon')},
  lines(){return this.items().map(i=>({...i,p:DB.get('products',i.id)})).filter(l=>l.p&&l.p.active)},
  count(){return this.lines().reduce((s,l)=>s+l.qty,0)},
  coupon(){return localStorage.getItem('sb_coupon')||''},
  totals(area='dhaka'){
    const lines=this.lines();
    const subtotal=lines.reduce((s,l)=>s+l.p.price*l.qty,0);
    const mrpTotal=lines.reduce((s,l)=>s+l.p.mrp*l.qty,0);
    let discount=0,code=this.coupon(),cp=null;
    if(code){cp=DB.all('coupons').find(c=>c.active&&c.code.toUpperCase()===code.toUpperCase());
      if(cp&&subtotal>=+cp.min){discount=cp.type==='percent'?Math.round(subtotal*cp.value/100):+cp.value}else cp=null}
    const st=S();
    let delivery=area==='outside'?+st.outsideDhakaCharge:+st.deliveryCharge;
    if(subtotal>=+st.freeDeliveryMin||!lines.length)delivery=0;
    return {lines,subtotal,mrpTotal,discount,delivery,total:Math.max(0,subtotal-discount+delivery),coupon:cp?cp.code:''};
  }
};

/* ========== product card ========== */
function card(p){
  const q=Cart.qtyOf(p.id), o=off(p), out=p.stock<=0;
  return `<div class="p-card" data-pid="${p.id}">
    ${o?`<span class="off">${bn(o)}% ছাড়</span>`:''}
    <a href="#/product/${p.id}" class="p-img">${pimg(p)}</a>
    <a href="#/product/${p.id}" class="p-name">${esc(p.name)}</a>
    <div class="p-unit">${esc(p.unit)} ${p.rx?'<span class="rx">Rx</span>':''}</div>
    <div class="price"><b>${tk(p.price)}</b>${o?`<s>${tk(p.mrp)}</s>`:''}</div>
    <span class="express">⚡ ${esc(S().expressText)}</span>
    <div class="stars">★ ${bn(p.rating)} <span class="muted">(${bn(p.reviews)})</span></div>
    ${out?`<button class="add" disabled>স্টক নেই</button>`:
      q?`<div class="qtybox"><button data-dec="${p.id}">−</button><span>${bn(q)}</span><button data-inc="${p.id}">+</button></div>`:
      `<button class="add" data-add="${p.id}">কার্টে যোগ করুন</button>`}
  </div>`;
}
function refreshCards(id){
  $$(`.p-card[data-pid="${id}"]`).forEach(el=>{const p=DB.get('products',id);if(p)el.outerHTML=card(p)});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-add],[data-inc],[data-dec]');
  if(t){
    const id=t.dataset.add||t.dataset.inc||t.dataset.dec;
    if(t.dataset.dec)Cart.set(id,Cart.qtyOf(id)-1);else Cart.add(id);
    if(t.dataset.add)toast('কার্টে যোগ হয়েছে ✓');
    refreshCards(id);
    if(location.hash.startsWith('#/cart'))route();
  }
  if(!e.target.closest('#dd'))$('#dd').classList.remove('open');
  else if(e.target.closest('#dd>button'))$('#dd').classList.toggle('open');
  if(!e.target.closest('#searchForm'))$('#suggest').style.display='none';
});

function summaryHTML(t){
  const s=S();
  return `<h3 style="margin-bottom:10px">অর্ডার সারাংশ</h3>
    <div><span>পণ্যের মূল্য (MRP)</span><span>${tk(t.mrpTotal)}</span></div>

    <div><span>সাবটোটাল</span><span>${tk(t.subtotal)}</span></div>
    ${t.discount?`<div style="color:var(--ok)"><span>কুপন (${esc(t.coupon)})</span><span>−${tk(t.discount)}</span></div>`:''}
    <div><span>ডেলিভারি চার্জ</span><span>${t.delivery?tk(t.delivery):'<b style="color:var(--ok)">ফ্রি</b>'}</span></div>
    ${t.subtotal<s.freeDeliveryMin?`<p style="font-size:13px;color:var(--accent);margin:4px 0">আরও ${tk(s.freeDeliveryMin-t.subtotal)} কিনলে ফ্রি ডেলিভারি!</p>`:''}

function applyCoupon(){
  const code=$('#cpIn').value.trim().toUpperCase();
  if(!code){localStorage.removeItem('sb_coupon');route();return}
  const cp=DB.all('coupons').find(c=>c.active&&c.code.toUpperCase()===code);
  if(!cp)return toast('কুপন কোড সঠিক নয়');
  const sub=Cart.totals().subtotal;
  if(sub<+cp.min)return toast(`এই কুপনের জন্য কমপক্ষে ${tk(cp.min)} কেনাকাটা করতে হবে`);
  localStorage.setItem('sb_coupon',cp.code);toast('কুপন প্রয়োগ হয়েছে ✓');route();
}

      </div>
    </div>
    <div class="block sum" style="position:sticky;top:130px">
      ${lines.map(l=>`<div style="font-size:14px"><span>${esc(l.p.name)} × ${bn(l.qty)}</span><span>${tk(l.p.price*l.qty)}</span></div>`).join('')}

function orderCard(o){
  const flow=['pending','confirmed','processing','shipped','delivered'],idx=flow.indexOf(o.status),st=STATUS[o.status];
  return `<div class="order-card"><div class="oh"><div><b>${esc(o.id)}</b><div class="muted" style="font-size:13px">${fmtDate(o.createdAt)}</div></div>
    <div style="text-align:right"><span class="pill" style="background:${st.c}">${st.l}</span><div style="font-weight:700;margin-top:4px">${tk(o.total)}</div></div></div>
    <div style="font-size:14px">${o.items.map(i=>`${esc(i.icon||'')} ${esc(i.name)} × ${bn(i.qty)}`).join('<br>')}</div>
    ${o.status==='cancelled'?'<p style="color:var(--err);margin-top:10px">এই অর্ডারটি বাতিল করা হয়েছে</p>':
    `<div class="timeline">${flow.map((s,i)=>`<div class="${i<=idx?'done':''}">${STATUS[s].l}</div>`).join('')}</div>`}
    ${o.status==='pending'?`<button class="btn outline" style="margin-top:10px;padding:6px 14px;font-size:14px" data-cancel="${o.id}">অর্ডার বাতিল করুন</button>`:''}
  </div>`;
}
function bindCancel(){
  $$('[data-cancel]').forEach(b=>b.onclick=()=>{
    if(!confirm('অর্ডারটি বাতিল করবেন?'))return;
    const o=DB.get('orders',b.dataset.cancel);if(!o||o.status!=='pending')return;
    o.items.forEach(i=>{const p=DB.get('products',i.id);if(p)p.stock+=i.qty});
    o.status='cancelled';o.history.push({status:'cancelled',at:Date.now(),by:'customer'});DB.save();toast('অর্ডার বাতিল হয়েছে');route();
  });
}

    <input type="file" id="rxFile" accept="image/*" hidden>

function bookingModal(title,priceLabel,extra,onSubmit){
  const u=User.get()||{},tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
  modal(`<h3>${title}</h3><p class="muted" style="margin-bottom:12px">${priceLabel}</p><form id="bkF">
    <div class="grid2"><label class="f">নাম *<input name="name" required value="${esc(u.name||'')}"></label><label class="f">মোবাইল *<input name="phone" required pattern="01[0-9]{9}" title="01XXXXXXXXX" value="${esc(u.phone||'')}"></label></div>
    <label class="f">তারিখ *<input type="date" name="date" required min="${tomorrow}" value="${tomorrow}"></label>${extra}
    <div style="display:flex;gap:8px"><button class="btn" style="flex:1">বুক করুন</button><button type="button" class="btn outline" onclick="closeModal()">বাতিল</button></div></form>`);
  $('#bkF').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target));closeModal()};
}

/* ========== router ========== */
function route(){
  timers.forEach(clearInterval);timers=[];
  const h=location.hash.slice(1)||'/',[path,qs]=h.split('?'),parts=path.split('/').filter(Boolean),q=new URLSearchParams(qs||'');
  const r=parts[0]||'';
  (V[r]||V.notfound)(parts[1]&&decodeURIComponent(parts[1]),q);
  $$('#tabs a').forEach(a=>a.classList.toggle('active',a.dataset.r===r));
  $('#dd').classList.remove('open');
}
let lastHash='';
window.addEventListener('hashchange',()=>{route();if(location.hash!==lastHash)window.scrollTo(0,0);lastHash=location.hash});
// অ্যাডমিনে কিছু বদলালে লাইভ আপডেট
window.onDBChange=()=>{renderHeader();renderFooter();if(!document.querySelector('form:focus-within'))route()};

applyTheme();renderHeader();renderFooter();route();
</script>

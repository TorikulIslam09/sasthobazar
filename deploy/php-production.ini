; SasthoBazar - recommended PHP settings for production.
; VPS: copy to /etc/php/8.2/fpm/conf.d/99-sasthobazar.ini (and /etc/php/8.2/cli/conf.d/ for cron), then restart php8.2-fpm.
; cPanel: MultiPHP INI Editor (or a php.ini / .user.ini in the site folder) - set the same values.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; uploads: product images (5 MB each), prescriptions, CSV import, backup restore
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

; sessions (the app also sets these; keep them here so nothing weakens them)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_trans_sid = 0
session.gc_maxlifetime = 7200

; no remote code includes, no shell-style functions the app does not need
allow_url_include = Off
disable_functions = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec

; speed
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
realpath_cache_size = 4096K

date.timezone = Asia/Dhaka
